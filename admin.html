<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanLobby Backoffice</title><meta name="robots" content="noindex,nofollow"><style>
:root{font-family:Inter,system-ui,sans-serif;color:#f4f4f5;background:#09090b;--lime:#a3e635;--line:#27272a;--muted:#a1a1aa;--panel:#111113}*{box-sizing:border-box}body{margin:0}header{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#0b0b0de8;position:sticky;top:0;z-index:3}.logo{font-weight:950;font-size:25px}.logo span{color:var(--lime)}.badge{font-size:11px;border:1px solid #3f3f46;border-radius:999px;padding:6px 9px;color:var(--muted)}main{max-width:1400px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:linear-gradient(180deg,#141416,#101012);border:1px solid var(--line);border-radius:14px;padding:18px}.label{font-size:12px;color:var(--muted)}.num{font-size:30px;font-weight:900;margin-top:7px}.tabs{display:flex;gap:8px;margin:24px 0 12px;flex-wrap:wrap}.tabs button{width:auto;margin:0;padding:9px 13px;background:#18181b;color:#fff;border:1px solid #3f3f46;border-radius:9px;cursor:pointer}.tabs button.active{background:var(--lime);color:#101010;border-color:var(--lime)}.panel{display:none}.panel.active{display:block}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.table th{color:var(--muted);font-weight:600;background:#111113}.ok{color:#4ade80}.warn{color:#fbbf24}.actions{display:flex;gap:8px;align-items:center}.action{border:1px solid #3f3f46;background:#18181b;color:#fff;padding:8px 11px;border-radius:8px;cursor:pointer}.action.primary{background:var(--lime);color:#101010;border-color:var(--lime);font-weight:800}.status{padding:4px 7px;border:1px solid #3f3f46;border-radius:999px;font-size:11px}.back{color:#a3e635;text-decoration:none}.error{color:#fb7185;padding:15px}.section-title{margin:28px 0 12px;font-size:20px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{padding:18px}.grid{grid-template-columns:1fr 1fr}.top{align-items:start;flex-direction:column}}
</style></head><body><header><div class="logo">Clean<span>Lobby</span></div><div class="actions"><span class="badge">BACKOFFICE · ADMIN</span> <a class="back" href="/">← Site</a></div></header><main><div class="top"><div><h1>Backoffice</h1><div class="muted" id="adminIdentity">Loading admin…</div></div><div class="actions"><button class="action primary" onclick="runMM()">Run matchmaking</button></div></div><div id="stats" class="grid"></div><div class="tabs"><button class="active" data-tab="accounts">Accounts</button><button data-tab="players">Players</button><button data-tab="teams">Teams</button><button data-tab="queue">Queue</button><button data-tab="matches">Matches</button></div><div id="accounts" class="panel active card"><div class="section-title">Accounts</div><div id="accountsTable"></div></div><div id="players" class="panel card"><div class="section-title">Players</div><div id="playersTable"></div></div><div id="teams" class="panel card"><div class="section-title">Teams</div><div id="teamsTable"></div></div><div id="queue" class="panel card"><div class="section-title">Matchmaking queue</div><div id="queueTable"></div></div><div id="matches" class="panel card"><div class="section-title">Matches</div><div id="matchesTable"></div></div></main><script>
let csrfToken=null;const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(u,o={}){o.headers={...(o.headers||{}),...(csrfToken?{'X-CSRF-Token':csrfToken}:{})};const r=await fetch(u,o);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){try{const [me,st,a,p,t,q,m]=await Promise.all([api('/api/admin/me'),api('/api/admin/stats'),api('/api/admin/accounts'),api('/api/admin/players'),api('/api/admin/teams'),api('/api/admin/queue'),api('/api/admin/matches')]);csrfToken=me.csrf_token;$('#adminIdentity').textContent=`${me.username} · Admin`;renderStats(st);renderAccounts(a);renderPlayers(p);renderTeams(t);renderQueue(q);renderMatches(m)}catch(e){document.body.innerHTML='<main><h1>Access denied</h1><p class="error">'+esc(e.message)+'</p></main>'}}
function renderStats(s){const x=[['Accounts',s.accounts],['Steam verified',s.verifiedAccounts],['Players',s.players],['Teams',s.teams],['Ready teams',s.readyTeams],['Queue',s.queuedTeams],['Matches',s.matches],['Completed',s.confirmedMatches],['Admins',s.admins]];$('#stats').innerHTML=x.map(a=>`<div class="card"><div class="label">${a[0]}</div><div class="num">${a[1]}</div></div>`).join('')}
const table=(heads,rows)=>`<div class="tablewrap"><table class="table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
function renderAccounts(a){$('#accountsTable').innerHTML=table(['ID','Username','Email','Email ✓','Admin','Player','Region','Created'],a.map(x=>`<tr><td>${x.id}</td><td>${esc(x.username)}</td><td>${esc(x.email)}</td><td>${x.email_verified?'<span class="ok">✓</span>':'—'}</td><td>${x.is_admin?'<span class="ok">YES</span>':'—'}</td><td>${x.player_id||'—'}</td><td>${esc(x.region||'—')}</td><td>${esc(x.created_at)}</td></tr>`).join(''))}
function renderPlayers(a){$('#playersTable').innerHTML=table(['ID','Display','Account','Country','Region','Level','Elo','Trust','Reliability','Teamplay'],a.map(x=>`<tr><td>${x.id}</td><td>${esc(x.display_name)}</td><td>${esc(x.username||'—')}</td><td>${esc(x.country||'—')}</td><td>${esc(x.region)}</td><td>${x.faceit_level}</td><td>${x.faceit_elo}</td><td>${x.trust_score}</td><td>${x.reliability_score}</td><td>${x.teamplay_score}</td></tr>`).join(''))}
function renderTeams(a){$('#teamsTable').innerHTML=table(['ID','Team','Captain','Region','Members','Status','Queued'],a.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.captain_name)}</td><td>${esc(x.region)}</td><td>${x.member_count}/5</td><td><span class="status">${esc(x.status)}</span></td><td>${x.queued?'YES':'—'}</td></tr>`).join(''))}
function renderQueue(a){$('#queueTable').innerHTML=a.length?table(['Team','Captain','Region','Members','Queued at'],a.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.captain_name)}</td><td>${esc(x.region)}</td><td>${x.member_count}/5</td><td>${esc(x.queued_at)}</td></tr>`).join('')):'<p class="muted">Queue is empty.</p>'}
function renderMatches(a){$('#matchesTable').innerHTML=a.length?table(['ID','Team A','Team B','Compatibility','Status','Accepted','Result (A–B)',''],a.map(x=>`<tr><td>${x.id}</td><td>${esc(x.team_a_name)}</td><td>${esc(x.team_b_name)}</td><td>${x.compatibility}%</td><td>${x.status==='DISPUTED'?'<span class="error">DISPUTED</span>':esc(x.status)}</td><td>${x.accepted_a?'A ✓':'A —'} / ${x.accepted_b?'B ✓':'B —'}</td><td>${x.score_a!=null?`<strong>${x.score_a}–${x.score_b}</strong>`:`A said ${esc(x.report_a||'—')} · B said ${esc(x.report_b||'—')}`}</td><td>${['CONFIRMED','DISPUTED'].includes(x.status)?`<button onclick="setResult(${x.id})">Set result</button> <button onclick="noResult(${x.id})">No result</button>`:''}</td></tr>`).join('')):'<p class="muted">No matches yet.</p>'}
async function setResult(id){const v=prompt('Final score, team A first (e.g. 13-9):');if(!v)return;const m=/^(\d{1,2})-(\d{1,2})$/.exec(v.trim());if(!m)return alert('Use the format 13-9');try{await api(`/api/admin/matches/${id}/result`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({score_a:Number(m[1]),score_b:Number(m[2])})});load()}catch(e){alert(e.message)}}
async function noResult(id){if(!confirm('Close this match without a result? It will not count for anyone.'))return;try{await api(`/api/admin/matches/${id}/result`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({no_result:true})});load()}catch(e){alert(e.message)}}
async function runMM(){try{const r=await api('/api/admin/run-matchmaking',{method:'POST'});alert(`${r.matches.length} match(es) created.`);load()}catch(e){alert(e.message)}}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});load();
</script></body></html>

# CleanLobby. certbot --nginx adds the HTTPS (443) parts and the http->https redirects to these blocks.
server {
    listen 80;
    server_name cleanlobby.com www.cleanlobby.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Old name: every stack5cs.com URL moves permanently to the same path on cleanlobby.com.
server {
    listen 80;
    server_name stack5cs.com www.stack5cs.com;
    return 301 https://cleanlobby.com$request_uri;
}

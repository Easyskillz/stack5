<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="keywords" content="CleanLobby, CS2 5v5, CS2 team matchmaking, CS2 Premier, CS2 Premier rating, Counter-Strike 2 5-stack, find CS2 team, CS2 premade teams, CS2 private matchmaking, CS2 without cheaters, cheater-free CS2, trusted CS2 players, CS2 trust score, CS2 Morocco, CS2 France, CS2 Belgium, CS2 Switzerland, CS2 Spain, CS2 Portugal, CS2 UK, CS2 Ireland, CS2 Maroc, CS2 équipe 5v5">
  <meta name="robots" content="{{robots}}">
  <link rel="canonical" href="{{url}}">
  {{alternates}}
  <meta name="theme-color" content="#080b0a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CleanLobby">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:image" content="{{base}}/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="{{locale}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{base}}/og.png">
  <link rel="stylesheet" href="/assets/app.css">
  <script>document.documentElement.className="js"</script>
  <script type="application/ld+json">{{jsonld}}</script>
</head>
<body>
<!-- Readable without JavaScript (search engines, LLM crawlers); app.js replaces it on load. -->
{{static}}
{{i18n}}<script src="/assets/app.js"></script>
</body>
</html>

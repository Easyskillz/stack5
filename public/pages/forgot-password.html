<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password · STACK5</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="header">
<a class="logo" href="/">STACK<span>5</span></a>
<div class="header-right"><a class="btn btn-dark btn-small" href="/login">Login</a></div>
</header>
<main class="container" style="max-width:460px">
<div class="eyebrow">STACK5</div>
<h1 style="font-size:40px">Forgot your password?</h1>
<p class="subtitle">Enter your account email and we'll send you a reset link.</p>
<div class="card" style="margin-top:25px">
<form id="forgotForm">
<input name="email" type="email" placeholder="Email" autocomplete="email" required style="width:100%;box-sizing:border-box;padding:13px;margin-bottom:15px;background:#0b100d;border:1px solid #28352e;color:#fff;border-radius:7px">
<button class="btn btn-green" style="width:100%">Send reset link</button>
<div id="message" class="muted" style="margin-top:12px"></div>
</form>
<div style="margin-top:18px;text-align:center"><a href="/login" class="muted">Back to login</a></div>
</div>
</main>
<footer><div style="max-width:1180px;margin:auto">STACK5 · Build. Match. Play. · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></div></footer>
<script>
const form = document.getElementById('forgotForm');
const message = document.getElementById('message');
form.onsubmit = async e => {
  e.preventDefault();
  const button = form.querySelector('button');
  button.disabled = true;
  message.style.color = '';
  message.textContent = 'Sending...';
  try {
    const r = await fetch('/api/auth/forgot-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: form.email.value.trim() }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Request failed.');
    message.textContent = j.message;
  } catch (err) {
    message.style.color = '#ff6b6b';
    message.textContent = err.message;
  } finally {
    button.disabled = false;
  }
};
</script>
</body>
</html>

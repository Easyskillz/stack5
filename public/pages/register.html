<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account · STACK5</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
.field{width:100%;box-sizing:border-box;padding:13px;margin-bottom:10px;background:#0b100d;border:1px solid #28352e;color:#fff;border-radius:7px}
.terms{display:flex;gap:10px;align-items:flex-start;margin:6px 0 15px;font-size:13px}
.terms input{margin-top:3px}
</style>
</head>
<body>
<header class="header">
<a class="logo" href="/">STACK<span>5</span></a>
<div class="header-right"><a class="btn btn-dark btn-small" href="/login">Login</a></div>
</header>
<main class="container" style="max-width:460px">
<div class="eyebrow">STACK5</div>
<h1 style="font-size:40px">Create your account.</h1>
<p class="subtitle">Build your profile, find your five and start playing.</p>
<div class="card" style="margin-top:25px">
<form id="registerForm">
<input class="field" name="username" placeholder="Username (3–24 letters, numbers or _)" autocomplete="username" pattern="[A-Za-z0-9_]{3,24}" required>
<input class="field" name="email" type="email" placeholder="Email" autocomplete="email" required>
<input class="field" name="password" type="password" placeholder="Password (min. 10 characters)" autocomplete="new-password" minlength="10" required>
<input class="field" name="password_confirm" type="password" placeholder="Confirm password" autocomplete="new-password" minlength="10" required>
<label class="terms muted"><input type="checkbox" name="terms" required> <span>I'm at least 16, I accept the <a href="/terms" target="_blank" style="color:var(--green)">Terms of Service</a> and I've read the <a href="/privacy" target="_blank" style="color:var(--green)">Privacy Policy</a>. My STACK5 profile and Trust Score will be public. STACK5 will never ask for my Steam password.</span></label>
<button class="btn btn-green" style="width:100%">Create account</button>
<div id="message" class="muted" style="margin-top:12px"></div>
</form>
<div style="margin-top:18px;text-align:center"><a href="/login" class="muted">Already have an account? Log in</a></div>
</div>
</main>
<script>
const form = document.getElementById('registerForm');
const message = document.getElementById('message');

form.onsubmit = async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  data.terms = form.terms.checked;
  if (data.password !== data.password_confirm) {
    message.style.color = '#ff6b6b';
    message.textContent = 'Passwords do not match.';
    return;
  }
  const button = form.querySelector('button');
  button.disabled = true;
  button.textContent = 'Creating account...';
  message.textContent = '';
  try {
    const r = await fetch('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Registration failed.');
    form.querySelectorAll('input,button').forEach(x => x.disabled = true);
    message.style.color = '';
    message.textContent = 'Account created. Check your email (and spam folder) and click the verification link, then log in.';
    button.textContent = 'Check your email';
  } catch (err) {
    message.style.color = '#ff6b6b';
    message.textContent = err.message;
    button.disabled = false;
    button.textContent = 'Create account';
  }
};
</script>
</body>
</html>

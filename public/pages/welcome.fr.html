<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bienvenue · CleanLobby</title>
<meta name="description" content="Termine la création de ton compte CleanLobby.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://cleanlobby.com/fr/welcome">
<meta name="theme-color" content="#0c0c0e">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="Bienvenue · CleanLobby"><meta property="og:type" content="website"><meta property="og:site_name" content="CleanLobby"><meta property="og:url" content="https://cleanlobby.com/fr/welcome"><meta property="og:locale" content="fr_FR">
<meta property="og:description" content="Termine la création de ton compte CleanLobby."><meta property="og:image" content="https://cleanlobby.com/og.png"><meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/app.css">
<style>
.field{width:100%;box-sizing:border-box;padding:13px;margin-bottom:10px;background:#0f0f12;border:1px solid #2e2e35;color:#fff;border-radius:7px}
.terms{display:flex;gap:10px;align-items:flex-start;margin:6px 0 15px;font-size:13px}
.terms input{margin-top:3px}
label.small{display:block;font-size:12px;margin:4px 0 6px}
</style>
</head>
<body>
<header class="header">
<a class="logo" href="/fr">Clean<span>Lobby</span></a>
<div class="lang-switch"><a class="lang-opt" href="/welcome" onclick="document.cookie='cl_lang=en; path=/; max-age=31536000; samesite=lax'" aria-label="English"><img src="/flags/us.svg" alt=""><span>EN</span></a><a class="lang-opt on" href="/fr/welcome" aria-label="Français"><img src="/flags/fr.svg" alt=""><span>FR</span></a></div>
</header>
<main class="container" style="max-width:460px">
<div class="eyebrow">COMPTE STEAM VÉRIFIÉ ✅</div>
<h1 style="font-size:40px">Bienvenue sur CleanLobby.</h1>
<p class="subtitle" id="intro">Choisis ton pseudo pour terminer la création de ton compte.</p>
<div class="card" style="margin-top:25px">
<form id="signupForm">
<label class="small muted">Pseudo</label>
<input class="field" name="username" placeholder="3 à 24 lettres, chiffres ou _" autocomplete="username" pattern="[A-Za-z0-9_]{3,24}" required>
<label class="small muted">E-mail (facultatif) : seulement pour les notifications de match et les infos importantes sur ton compte</label>
<input class="field" name="email" type="email" placeholder="toi@exemple.com" autocomplete="email">
<label class="terms muted"><input type="checkbox" name="terms" required> <span>J’ai au moins 16 ans, j’accepte les <a href="/fr/terms" target="_blank" style="color:var(--accent)">Conditions d’utilisation</a> et j’ai lu la <a href="/fr/privacy" target="_blank" style="color:var(--accent)">Politique de confidentialité</a>. Mon profil CleanLobby et mon Trust Score seront publics.</span></label>
<button class="btn btn-green" style="width:100%">Créer mon compte</button>
<div id="message" class="muted" style="margin-top:12px"></div>
</form>
</div>
</main>
<footer><div style="max-width:1180px;margin:auto">CleanLobby · Crée. Matche. Joue. · <a href="/fr/guide">Comment ça marche</a> · <a href="/fr/contact">Contact</a> · <a href="/fr/terms">Conditions</a> · <a href="/fr/privacy">Confidentialité</a></div></footer>
<script src="/i18n/fr.js"></script>
<script>
const fr = text => (window.CL_FR || {})[text] || text;
const form = document.getElementById('signupForm');
const message = document.getElementById('message');
const expired = text => { location.href = '/fr/login?error=' + encodeURIComponent(text); };

fetch('/api/auth/signup').then(async r => {
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) return expired(j.error);
  if (j.persona) document.getElementById('intro').textContent = `Connecté en tant que ${j.persona} sur Steam. Choisis ton pseudo CleanLobby pour terminer.`;
  if (j.suggested_username) form.username.value = j.suggested_username;
});

form.onsubmit = async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  const button = form.querySelector('button');
  button.disabled = true;
  message.style.color = '';
  message.textContent = 'Création de ton compte…';
  try {
    const r = await fetch('/api/auth/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) return expired(j.error);
    if (!r.ok) throw new Error(fr(j.error || 'Something went wrong.'));
    location.href = '/fr/play';
  } catch (err) {
    message.style.color = '#ff6b6b';
    message.textContent = err.message;
    button.disabled = false;
  }
};
</script>
</body>
</html>

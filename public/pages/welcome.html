<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome · CleanLobby</title>
<meta name="description" content="Finish creating your CleanLobby account.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://cleanlobby.com/welcome">
<meta name="theme-color" content="#0c0c0e">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="Welcome · CleanLobby"><meta property="og:type" content="website"><meta property="og:site_name" content="CleanLobby"><meta property="og:url" content="https://cleanlobby.com/welcome">
<meta property="og:description" content="Finish creating your CleanLobby account."><meta property="og:image" content="https://cleanlobby.com/og.png"><meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/app.css">
<style>
.field{width:100%;box-sizing:border-box;padding:13px;margin-bottom:10px;background:#0f0f12;border:1px solid #2e2e35;color:#fff;border-radius:7px}
.terms{display:flex;gap:10px;align-items:flex-start;margin:6px 0 15px;font-size:13px}
.terms input{margin-top:3px}
label.small{display:block;font-size:12px;margin:4px 0 6px}
</style>
</head>
<body>
<header class="header">
<a class="logo" href="/">Clean<span>Lobby</span></a>
<div class="lang-switch"><a class="lang-opt on" href="/welcome" aria-label="English"><img src="/flags/us.svg" alt=""><span>EN</span></a><a class="lang-opt" href="/fr/welcome" onclick="document.cookie='cl_lang=fr; path=/; max-age=31536000; samesite=lax'" aria-label="Français"><img src="/flags/fr.svg" alt=""><span>FR</span></a></div>
</header>
<main class="container" style="max-width:460px">
<div class="eyebrow">STEAM ACCOUNT VERIFIED ✅</div>
<h1 style="font-size:40px">Welcome to CleanLobby.</h1>
<p class="subtitle" id="intro">Pick your username to finish creating your account.</p>
<div class="card" style="margin-top:25px">
<form id="signupForm">
<label class="small muted">Username</label>
<input class="field" name="username" placeholder="3–24 letters, numbers or _" autocomplete="username" pattern="[A-Za-z0-9_]{3,24}" required>
<label class="small muted">Email (optional): only for match notifications and important account news</label>
<input class="field" name="email" type="email" placeholder="you@example.com" autocomplete="email">
<label class="terms muted"><input type="checkbox" name="terms" required> <span>I'm at least 16, I accept the <a href="/terms" target="_blank" style="color:var(--accent)">Terms of Service</a> and I've read the <a href="/privacy" target="_blank" style="color:var(--accent)">Privacy Policy</a>. My CleanLobby profile and Trust Score will be public.</span></label>
<button class="btn btn-green" style="width:100%">Create my account</button>
<div id="message" class="muted" style="margin-top:12px"></div>
</form>
</div>
</main>
<footer><div style="max-width:1180px;margin:auto">CleanLobby · Build. Match. Play. · <a href="/guide">How it works</a> · <a href="/contact">Contact</a> · <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a></div></footer>
<script>
const form = document.getElementById('signupForm');
const message = document.getElementById('message');
const expired = text => { location.href = '/login?error=' + encodeURIComponent(text); };

fetch('/api/auth/signup').then(async r => {
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) return expired(j.error);
  if (j.persona) document.getElementById('intro').textContent = `Signed in as ${j.persona} on Steam. Pick your CleanLobby username to finish.`;
  if (j.suggested_username) form.username.value = j.suggested_username;
});

form.onsubmit = async e => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  const button = form.querySelector('button');
  button.disabled = true;
  message.style.color = '';
  message.textContent = 'Creating your account...';
  try {
    const r = await fetch('/api/auth/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) return expired(j.error);
    if (!r.ok) throw new Error(j.error || 'Something went wrong.');
    location.href = '/play';
  } catch (err) {
    message.style.color = '#ff6b6b';
    message.textContent = err.message;
    button.disabled = false;
  }
};
</script>
</body>
</html>
